# Сборка .ipa без подписи на облачном маке GitHub.
# Подписывает и ставит на iPhone Sideloadly с обычным Apple ID (бесплатно, на 7 дней).
name: iOS build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 58 требует Xcode 26.4+, он есть только на macos-26 (на macos-15 максимум 26.3).
    # macos-26 (arm64) у GitHub часто без свободных машин, берём Intel-вариант того же образа.
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -viE 'beta|_rc' | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Нативный проект
        run: npx expo prebuild --platform ios --clean

      - name: Кэш CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      - name: Pods
        working-directory: ios
        run: pod install

      - name: Сборка
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Noir.xcworkspace \
            -scheme Noir \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > ../xcodebuild.log 2>&1 || {
              echo "::group::Ошибки"; grep -nE "error:|error [A-Z]|fatal|Error:" ../xcodebuild.log | grep -v "Werror" | head -n 60; echo "::endgroup::"
              exit 1
            }
          tail -n 5 ../xcodebuild.log

      - name: Лог сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Упаковка ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Noir.app Payload/
          zip -qry Noir.ipa Payload
          ls -lh Noir.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Noir-ipa
          path: Noir.ipa
          retention-days: 30
